{% extends "base.html" %}
{% block content %}
  <section class="hero">
    <p class="eyebrow">fill4you</p>
    <h1>당신을 위한 When2meet 초안 자동완성</h1>
    {% if user %}
      <p>로그인됨: {{ user.display_name }}</p>
      <form method="post" action="/auth/logout"><button type="submit">로그아웃</button></form>
    {% else %}
      {% if auth_error %}<p class="notice">Google 로그인이 아직 설정되지 않았습니다.</p>{% endif %}
      <a class="button" href="/auth/google">Google로 계속하기</a>
      {% if development_login_enabled %}
        <form method="post" action="/auth/development"><button class="text-button" type="submit">개발용 로그인</button></form>
      {% endif %}
    {% endif %}
  </section>
{% endblock %}
