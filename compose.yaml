services:
  app:
    build: .
    command: >-
      sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app
      --host ${APP_HOST:-0.0.0.0} --port ${APP_PORT:-8000}
      --workers ${APP_WORKERS:-1} --log-level ${APP_LOG_LEVEL:-info}"
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      APP_NAME: ${APP_NAME:-fill4you}
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-fill4you}
      POSTGRES_USER: ${POSTGRES_USER:-fill4you}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fill4you}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-development-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_SYNC_PAST_DAYS: ${GOOGLE_SYNC_PAST_DAYS:-7}
      GOOGLE_SYNC_FUTURE_DAYS: ${GOOGLE_SYNC_FUTURE_DAYS:-90}
      GOOGLE_SYNC_INTERVAL_MINUTES: ${GOOGLE_SYNC_INTERVAL_MINUTES:-15}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fill4you_session}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      APP_WORKERS: ${APP_WORKERS:-1}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DEVELOPMENT_USER_EMAIL: ${DEVELOPMENT_USER_EMAIL:-developer@fill4you.local}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fill4you}
      POSTGRES_USER: ${POSTGRES_USER:-fill4you}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fill4you}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fill4you} -d ${POSTGRES_DB:-fill4you}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
